[project]
name = "django-notify-hub"
version = "0.1.0"
description = "A reusable Django app for unified notifications (Email, SMS, Push)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "django>=4.2",
    "O365>=2.0.27",
    "google-api-python-client>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "firebase-admin>=6.0.0",
    "phonenumbers>=8.13.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
