[project]
name = "django-notify-hub"
version = "0.1.0"
description = "A reusable Django app for unified notifications (Email, SMS, Push)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Just a dev"}]

dependencies = [
  "django>=4.2",
  "O365>=2.1",
  "google-api-python-client>=2.187.0",
  "google-auth-oauthlib>=1.2.3",
  "firebase-admin>=7.1.0",
  "phonenumbers>=9.0.21",
]

# Dev dependencies (install with: pip install -e ".[dev]")
[project.optional-dependencies]
dev = [
  "ruff>=0.14.10",
  "pre-commit>=4.5.1",
  "pytest>=9.0.2",
  "pytest-django>=4.11.1",
  "coverage[toml]>=0.10.2",
  "build>=1.3.0",
  "twine>=6.2.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Optional but recommended for src-layout packages
[tool.setuptools]
package-dir = { "" = "src" }

# -------------------------
# Ruff (lint + format)
# -------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  ".venv",
  "dist",
  "build",
  ".eggs",
  "*.egg-info",
  ".mypy_cache",
  ".pytest_cache",
]

[tool.ruff.lint]
# Reasonable defaults for Django libs:
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "W",   # pycodestyle warnings
  "I",   # import sorting
  "B",   # bugbear
  "UP",  # pyupgrade
  "SIM", # simplify
  "N",   # pep8-naming
]
ignore = [
  "N999", # allow non-PEP8 module/package names if needed
]

[tool.ruff.lint.per-file-ignores]
# tests can be looser
"tests/**.py" = ["S101"]
# migrations often violate style rules; ignore if you ship migrations
"**/migrations/**.py" = ["E501", "N806", "N999"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# -------------------------
# Pytest (optional but handy)
# -------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]

# -------------------------
# Coverage (optional)
# -------------------------
[tool.coverage.run]
branch = true
source = ["django_notify_hub"]

[tool.coverage.report]
show_missing = true
skip_covered = true
